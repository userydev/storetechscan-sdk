[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storetechscan"
version = "1.0.0"
description = "Zero-dependency Python SDK for StoreTechScan — pay-as-you-go website tech stack, passive DNS, auditable evidence[], and live Shopify/WooCommerce/DTC product price & availability API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "StoreTechScan", email = "storetechscan-support@ydev.work" }]
keywords = [
  "storetechscan",
  "tech-stack",
  "wappalyzer-alternative",
  "builtwith-alternative",
  "store-leads-alternative",
  "shopify",
  "woocommerce",
  "ecommerce-api",
  "dns-fingerprinting",
  "pay-as-you-go",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://storetechscan.com"
Repository = "https://github.com/userydev/storetechscan-sdk"
Documentation = "https://storetechscan.com/docs/openapi"
Pricing = "https://storetechscan.com/pricing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storetechscan = ["py.typed"]
